apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: semaphoreui-ingress
  namespace: semaphoreui
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: semaphoreui.minikube.net 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: semaphore
            port:
              number: 3000
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  namespace: kube-system
  annotations:
    # Traefik-specific annotations (K3s default ingress controller)
    traefik.ingress.kubernetes.io/router.entrypoints: web
    ingress.kubernetes.io/class: "traefik"
spec:
  rules:
  - host: development.headlamp.local 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headlamp
            port:
              number: 80
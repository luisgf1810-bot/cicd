apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: mycluster
servers: 1
agents: 2
registries:
  config: | 
    mirrors:
      harbor.local:
        endpoint:
          - https://harbor.local
    configs:
      harbor.local:
        auth:
          username: admin
          password: admin
kubeAPI:
  hostPort: "6443"
image: rancher/k3s:latest
ports:
  - port: 1443:443
    nodeFilters:
      - loadbalancer
  - port: 1080:80
    nodeFilters:
      - loadbalancer

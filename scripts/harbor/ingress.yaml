apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-registry-ingress
  namespace: default
  annotations:
    # Traefik-specific annotations (K3s default ingress controller)
    traefik.ingress.kubernetes.io/router.entrypoints: web
    ingress.kubernetes.io/class: "traefik"
spec:
  rules:
  - host: harbor.registry.local 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: harbor-registry
            port:
              number: 5000
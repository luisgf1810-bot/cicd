apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  containers:
  - name: nginx
    image: harbor.minikube.net/library/nginx:latest
    ports:
      - containerPort: 80
        name: http-web-svc
  imagePullSecrets:
  - name: harbor
  
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
  - name: nginx
    protocol: TCP
    port: 80
    targetPort: http-web-svc
